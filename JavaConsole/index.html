<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js"></script>
</head>
<body>
    <form method="post" action="https://script.google.com/macros/s/AKfycbzuYVSle3OQIroc1Uegh4GjXbUzw9d4duTJ57OciU6Rzuw5tcojbSmVg5GXlfnxexHlaA/exec"> 
        <fieldset>
            <h3>Ваши личные данные<h3>
            <label>
                Ваше имя
                <input class="input" type="text" placeholder="Имя" required name="name">
            </label>
            <label>
                Ваш возраст
                <input class="input" type="number" placeholder="Возраст" required name="age">
            </label>
            <label>
                Ваш номер телефона
                <input class="input" type="tel" placeholder="Номер телефона" required name="phone">
            </label>
            <label>
                Ваша почта
                <input class="input" type="email" placeholder="Почта" required name="mail">
            </label>
            <label>
                Сообщение
                <textarea placeholder="Ваше сообщение" required name="message"></textarea>
            </label>
            <label class="label">
                Я принимаю правила
                <input class="inputs" type="checkbox" required name="flag">
            </label>
            <button>Отправить</button>
        </fieldset>
    </form>
</body>
</html>
